name: image
on:
  push:
    branches: [main]
permissions: {contents: read, packages: write}
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        run: printf '%s' "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/re8ch/among-clusters:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true
