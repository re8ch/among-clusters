name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.24.x", cache: true}
      - run: go test ./...
      - run: go vet ./...
      - uses: azure/setup-helm@v4
      - run: helm lint charts/among-clusters-hub --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - run: helm lint charts/among-clusters-agent -f charts/among-clusters-agent/examples/artc-values.yaml
      - run: helm template hub charts/among-clusters-hub --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa >/tmp/hub.yaml
      - run: helm template agent charts/among-clusters-agent -f charts/among-clusters-agent/examples/qwen-values.yaml >/tmp/agent.yaml
