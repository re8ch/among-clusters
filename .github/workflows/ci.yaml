name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.24.x", cache: true}
      - run: go test ./...
      - run: go vet ./...
      - uses: azure/setup-helm@v4
      - name: Lint and render all charts
        run: |
          digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          helm lint charts/among-clusters-hub --set image.digest=$digest
          helm template hub charts/among-clusters-hub --set image.digest=$digest >/tmp/hub.yaml
          helm template hub-managed charts/among-clusters-hub --namespace among-clusters --set image.digest=$digest --set managedAccess.enabled=true >/tmp/hub-managed.yaml
          helm lint charts/among-clusters-agent --set clusterID=test --set tenant=test --set trustDomain=test.example --set image.digest=$digest
          helm template agent charts/among-clusters-agent --set clusterID=test --set tenant=test --set trustDomain=test.example --set image.digest=$digest >/tmp/agent.yaml
          helm template agent-managed charts/among-clusters-agent --namespace tenant --set clusterID=test --set tenant=test --set trustDomain=test.example --set hubEndpoint=https://hub.example --set image.digest=$digest --set gateway.peerBundleSecret=peer --set managedAccess.enabled=true --set managedAccess.brokerEndpoint=https://hub.example/broker >/tmp/agent-managed.yaml
          helm lint charts/among-clusters-headlamp --set headlamp.pluginsPVC.existingClaim=plugins
          helm template headlamp charts/among-clusters-headlamp --set headlamp.pluginsPVC.existingClaim=plugins >/tmp/headlamp.yaml
          helm dependency build charts/among-clusters
          helm lint charts/among-clusters --set agent.enabled=true --set among-clusters-agent.clusterID=test --set among-clusters-agent.tenant=test --set among-clusters-agent.trustDomain=test.example --set among-clusters-agent.image.digest=$digest
      - name: Enforce sovereign API and least privilege
        run: |
          test "$(grep -c '^kind: CustomResourceDefinition' charts/among-clusters-hub/crds/sovereign-peering.yaml)" = 7
          if grep -R 'cluster-admin' charts; then exit 1; fi
          if grep -R 'resources:.*secrets.*verbs:.*list' charts/among-clusters-agent; then exit 1; fi
          if grep -R 'RouteAdvertisement\|podCIDR\|remote.*kubeconfig' charts/among-clusters-hub/crds; then exit 1; fi
          grep -q 'migration.replaceCollaborationCRDs=true' charts/among-clusters-hub/templates/migration-guard.yaml
  headlamp:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: ui/headlamp-plugin}}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 11.19.0}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: pnpm, cache-dependency-path: ui/headlamp-plugin/pnpm-lock.yaml}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run tsc && pnpm run lint && pnpm run build
      - name: Verify embedded plugin digest and read-only API surface
        working-directory: .
        run: |
          echo 'cd07ec6dd2303c7fda971c8685c8a5baf66717f6f627077dfd2cab03e161b134  charts/among-clusters-headlamp/files/plugin.tar.gz' | sha256sum -c -
          if grep -R 'create\|update\|delete\|Secret' ui/headlamp-plugin/src; then exit 1; fi
