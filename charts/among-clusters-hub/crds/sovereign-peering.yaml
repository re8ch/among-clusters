apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: clusteridentities.peering.re8ch.com}
spec:
  group: peering.re8ch.com
  scope: Namespaced
  names: {plural: clusteridentities, singular: clusteridentity, kind: ClusterIdentity, shortNames: [acid]}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      additionalPrinterColumns:
        - {name: Trust Domain, type: string, jsonPath: .spec.trustDomain}
        - {name: State, type: string, jsonPath: .status.state}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [clusterID, trustDomain, spiffeID, bundleDigest, publicKey]
              properties:
                clusterID: {type: string, minLength: 1, maxLength: 63}
                trustDomain: {type: string, pattern: '^[a-z0-9.-]+$'}
                spiffeID: {type: string, pattern: '^spiffe://'}
                bundleDigest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
                publicKey: {type: string, minLength: 43, maxLength: 128}
                capabilities: {type: array, items: {type: string}}
                gatewayEndpoints: {type: array, items: {type: string, pattern: '^quic://'}}
                suspended: {type: boolean, default: false}
            status:
              type: object
              properties:
                state: {type: string, enum: [Pending, Ready, Suspended, Revoked]}
                lastSeenAt: {type: string, format: date-time}
                observedGeneration: {type: integer, format: int64}
                lastGeneration: {type: integer, format: int64, minimum: 0}
                lastNonce: {type: string}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: peers.peering.re8ch.com}
spec:
  group: peering.re8ch.com
  scope: Namespaced
  names: {plural: peers, singular: peer, kind: Peer, shortNames: [acpeer]}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [localIdentityRef, remoteIdentityRef, invitationRef, transports]
              properties:
                localIdentityRef: {type: string}
                remoteIdentityRef: {type: string}
                invitationRef: {type: string}
                transports: {type: array, minItems: 1, items: {type: string, enum: [quic-mtls, wireguard, cilium, istio]}}
                suspended: {type: boolean, default: false}
            status:
              type: object
              properties:
                state: {type: string, enum: [PendingConfirmation, Ready, Suspended, Revoked, Failed]}
                reason: {type: string}
                observedGeneration: {type: integer, format: int64}
                localBundleConfirmed: {type: boolean}
                remoteBundleConfirmed: {type: boolean}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: authenticatedlinks.peering.re8ch.com}
spec:
  group: peering.re8ch.com
  scope: Namespaced
  names: {plural: authenticatedlinks, singular: authenticatedlink, kind: AuthenticatedLink, shortNames: [aclink]}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [peerRef, transport]
              properties:
                peerRef: {type: string}
                transport: {type: string, enum: [quic-mtls]}
                localGateway: {type: string}
                remoteGateway: {type: string}
                sessionIdentity: {type: string, pattern: '^spiffe://'}
            status:
              type: object
              properties:
                state: {type: string, enum: [Pending, Connecting, Ready, Disconnected, Blocked, Closed, Failed]}
                reason: {type: string, enum: ['', NATUnreachable, IdentityMismatch, BundleMismatch, PolicyDenied, TransportError, ObservationStale, Revoked]}
                latencyMillis: {type: integer, format: int64, minimum: 0}
                lastHandshakeAt: {type: string, format: date-time}
                lastObservedAt: {type: string, format: date-time}
                observedGeneration: {type: integer, format: int64}
---
apiVersion: apiextensions.k8s.io/v1
