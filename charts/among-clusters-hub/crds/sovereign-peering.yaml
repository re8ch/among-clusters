apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: serviceadvertisements.peering.re8ch.com}
spec:
  group: peering.re8ch.com
  scope: Namespaced
  names: {plural: serviceadvertisements, singular: serviceadvertisement, kind: ServiceAdvertisement, shortNames: [acadv]}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [publisherRef, serviceIdentity, serviceClass, protocol, port, targetPeers, ttlSeconds, generation, policyRef]
              properties:
                publisherRef: {type: string}
                serviceIdentity: {type: string, pattern: '^spiffe://'}
                serviceClass: {type: string}
                protocol: {type: string, enum: [http, https, tcp, tls, kubernetes-api]}
                port: {type: integer, minimum: 1, maximum: 65535}
                localServiceRef:
                  type: object
                  required: [name]
                  properties: {name: {type: string}, namespace: {type: string}, portName: {type: string}}
                gatewayEndpoints: {type: array, items: {type: string, pattern: '^quic://'}}
                targetPeers: {type: array, minItems: 1, items: {type: string}}
                ttlSeconds: {type: integer, minimum: 30, maximum: 86400}
                generation: {type: integer, format: int64, minimum: 1}
                policyRef: {type: string}
                revoked: {type: boolean, default: false}
              x-kubernetes-validations:
                - {rule: '!has(self.localServiceRef) || !has(self.localServiceRef.namespace)', message: Cross-namespace service references are forbidden; omit namespace for the local namespace}
            status:
              type: object
              properties:
                state: {type: string, enum: [Pending, Active, Expired, Denied, Revoked]}
                expiresAt: {type: string, format: date-time}
                reason: {type: string}
---
