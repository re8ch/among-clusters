apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: managedaccessgrants.peering.re8ch.com}
spec:
  group: peering.re8ch.com
  scope: Namespaced
  names: {plural: managedaccessgrants, singular: managedaccessgrant, kind: ManagedAccessGrant, shortNames: [acgrant]}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [peerRef, advertisementRef, expiresAt, namespaces, rules]
              properties:
                peerRef: {type: string}
                advertisementRef: {type: string}
                expiresAt: {type: string, format: date-time}
                namespaces: {type: array, minItems: 1, items: {type: string}}
                rules:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [apiGroups, resources, verbs]
                    properties:
                      apiGroups: {type: array, items: {type: string}}
                      resources: {type: array, items: {type: string}}
                      verbs: {type: array, items: {type: string, enum: [get, list, watch, create, update, patch, delete]}}
                approved: {type: boolean, default: false}
                revoked: {type: boolean, default: false}
            status:
              type: object
              properties:
                state: {type: string, enum: [Pending, AwaitingLocalApproval, Provisioning, Active, Expired, Revoked, Failed]}
                credentialRef: {type: string}
                lastRenewedAt: {type: string, format: date-time}
                reason: {type: string}
