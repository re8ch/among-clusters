apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: collaborationclusters.collaboration.re8ch.com}
spec:
  group: collaboration.re8ch.com
  scope: Cluster
  names: {plural: collaborationclusters, singular: collaborationcluster, kind: CollaborationCluster, shortNames: [accluster]}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      additionalPrinterColumns:
        - {name: Owner, type: string, jsonPath: .spec.owner}
        - {name: State, type: string, jsonPath: .status.state}
        - {name: Last heartbeat, type: date, jsonPath: .status.lastHeartbeatTime}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [owner, identity]
              properties:
                owner: {type: string, minLength: 1}
                displayName: {type: string}
                capabilities: {type: array, items: {type: string}}
                suspended: {type: boolean, default: false}
                identity:
                  type: object
                  required: [ed25519PublicKey]
                  properties: {ed25519PublicKey: {type: string, minLength: 43, maxLength: 44}}
            status:
              type: object
              properties:
                state: {type: string, enum: [Alive, Degraded, Unreachable, Suspended]}
                lastHeartbeatTime: {type: string, format: date-time}
                lastSequence: {type: integer, format: int64, minimum: 0}
                kubernetesVersion: {type: string}
                summary: {type: object, x-kubernetes-preserve-unknown-fields: true}
