{{- if .Values.managedAccess.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata: {name: among-clusters-credential-broker, namespace: {{ .Values.managedAccess.broker.namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: among-clusters-credential-broker, namespace: {{ .Values.managedAccess.broker.namespace }}}
rules: [{apiGroups: [""], resources: [secrets], verbs: [get, create, update, delete]}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: among-clusters-credential-broker, namespace: {{ .Values.managedAccess.broker.namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: among-clusters-credential-broker}
subjects: [{kind: ServiceAccount, name: among-clusters-credential-broker, namespace: {{ .Values.managedAccess.broker.namespace }}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: among-clusters-credential-broker, namespace: {{ .Values.managedAccess.broker.namespace }}}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: among-clusters-credential-broker}}
  template:
    metadata: {labels: {app.kubernetes.io/name: among-clusters-credential-broker}}
    spec:
      serviceAccountName: among-clusters-credential-broker
      automountServiceAccountToken: true
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: broker
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          command: [/broker]
          env:
            - {name: HUB_ENDPOINT, value: "http://among-clusters-hub.{{ .Release.Namespace }}.svc"}
            - {name: CREDENTIAL_NAMESPACE, value: {{ .Values.managedAccess.broker.namespace | quote }}}
          ports: [{name: http, containerPort: 8080}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: among-clusters-credential-broker, namespace: {{ .Values.managedAccess.broker.namespace }}}
spec: {selector: {app.kubernetes.io/name: among-clusters-credential-broker}, ports: [{name: http, port: 80, targetPort: http}]}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata: {name: among-clusters-hub, namespace: {{ .Values.managedAccess.broker.namespace }}}
spec:
  from: [{group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: {{ .Release.Namespace }}}]
  to: [{group: "", kind: Service, name: among-clusters-credential-broker}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: among-clusters-credential-broker, namespace: {{ .Values.managedAccess.broker.namespace }}}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: among-clusters-credential-broker}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: headlamp}}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to: [{namespaceSelector: {}}]
      ports: [{protocol: TCP, port: 80}, {protocol: TCP, port: 443}, {protocol: TCP, port: 6443}, {protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
{{- end }}
