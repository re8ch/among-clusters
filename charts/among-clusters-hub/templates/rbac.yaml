apiVersion: v1
kind: ServiceAccount
metadata: {name: among-clusters-hub}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: among-clusters-hub}
rules:
  - apiGroups: [peering.re8ch.com]
    resources: [clusteridentities, clusteridentities/status, peers, peers/status, authenticatedlinks, authenticatedlinks/status, peerpolicies, serviceadvertisements, serviceadvertisements/status, importedservices, importedservices/status, managedaccessgrants, managedaccessgrants/status]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [secrets, services]
    verbs: [get, list, create, update, patch]
  {{- if .Values.migration.replaceCollaborationCRDs }}
  - apiGroups: [collaboration.re8ch.com]
    resources: [collaborationclusters, collaborationrelationships, publishedservices, collaborationevents]
    verbs: [get, list]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, delete]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: among-clusters-hub}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: among-clusters-hub}
subjects: [{kind: ServiceAccount, name: among-clusters-hub, namespace: "{{ .Release.Namespace }}"}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: among-clusters-view
  labels: {rbac.authorization.k8s.io/aggregate-to-view: "true"}
rules:
  - apiGroups: [peering.re8ch.com]
    resources: [clusteridentities, peers, authenticatedlinks, peerpolicies, serviceadvertisements, importedservices, managedaccessgrants]
    verbs: [get, list, watch]
