apiVersion: apps/v1
kind: Deployment
metadata: {name: among-clusters-agent}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: among-clusters-agent}}
  template:
    metadata: {labels: {app.kubernetes.io/name: among-clusters-agent}}
    spec:
      serviceAccountName: among-clusters-agent
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      {{- with .Values.hostAliases }}
      hostAliases: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          command: [/agent]
          env:
            - {name: CLUSTER_ID, value: "{{ .Values.clusterID }}"}
            - {name: TENANT, value: "{{ .Values.tenant }}"}
            - {name: TRUST_DOMAIN, value: "{{ .Values.trustDomain }}"}
            - {name: HUB_ENDPOINT, value: "{{ .Values.hubEndpoint }}"}
            - {name: IDENTITY_SECRET, value: "{{ .Values.identitySecret }}"}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: INVITATION_TOKEN
              valueFrom: {secretKeyRef: {name: "{{ .Values.invitation.existingSecret }}", key: "{{ .Values.invitation.tokenKey }}", optional: true}}
            - name: INVITATION_ID
              valueFrom: {secretKeyRef: {name: "{{ .Values.invitation.existingSecret }}", key: "{{ .Values.invitation.idKey }}", optional: true}}
            - {name: GATEWAY_ENDPOINT, value: "{{ .Values.gateway.listener.publicEndpoint }}"}
            - {name: PEER_CONFIRMATIONS, value: {{ .Values.peerConfirmations | toJson | quote }}}
            - {name: LINK_OBSERVATIONS, value: {{ .Values.linkObservations | toJson | quote }}}
            - {name: PEER_BUNDLE_FILE, value: /peer-bundles/ca.crt}
            - {name: KUBERNETES_TLS_SERVER_NAME, value: {{ .Values.managedAccess.tlsServerName | quote }}}
            {{- if .Values.managedAccess.enabled }}
            - {name: BROKER_ENDPOINT, value: {{ required "managedAccess.brokerEndpoint is required" .Values.managedAccess.brokerEndpoint | quote }}}
            {{- end }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: kubernetes-api, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
          {{- if .Values.gateway.peerBundleSecret }}
            - {name: peer-bundles, mountPath: /peer-bundles, readOnly: true}
          {{- end }}
      volumes:
        - name: kubernetes-api
          projected:
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 3600}
              - configMap: {name: kube-root-ca.crt, items: [{key: ca.crt, path: ca.crt}]}
              - downwardAPI: {items: [{path: namespace, fieldRef: {fieldPath: metadata.namespace}}]}
        {{- if .Values.gateway.peerBundleSecret }}
        - name: peer-bundles
          secret: {secretName: "{{ .Values.gateway.peerBundleSecret }}"}
        {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: among-clusters-gateway}
{{- if and (or .Values.gateway.listener.enabled (gt (len .Values.gateway.imports) 0) (gt (len .Values.gateway.sessions) 0)) (not .Values.gateway.peerBundleSecret) }}{{ fail "gateway.peerBundleSecret is required for listener, imports, or sessions" }}{{- end }}
spec:
  {{- if gt (int .Values.gateway.listener.hostPort) 0 }}
  strategy: {type: Recreate}
  {{- end }}
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: among-clusters-gateway}}
  template:
    metadata: {labels: {app.kubernetes.io/name: among-clusters-gateway}}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          command: [/gateway]
          env:
            - {name: LISTEN_ADDRESS, value: ":{{ .Values.gateway.listener.port }}"}
            - {name: LISTENER_ENABLED, value: {{ .Values.gateway.listener.enabled | quote }}}
            - {name: EXPORTS_JSON, value: {{ .Values.gateway.exports | toJson | quote }}}
            - {name: EXPORTS_FILE, value: /routes/exports.json}
            - {name: IMPORTS_JSON, value: {{ .Values.gateway.imports | toJson | quote }}}
            - {name: PEER_SESSIONS_JSON, value: {{ .Values.gateway.sessions | toJson | quote }}}
            - {name: PEER_IDENTITIES_JSON, value: {{ .Values.gateway.peerIdentities | toJson | quote }}}
          ports:
            - name: gateway
              containerPort: {{ .Values.gateway.listener.port }}
              protocol: UDP
            - {name: readiness, containerPort: 8080, protocol: TCP}
              {{- if gt (int .Values.gateway.listener.hostPort) 0 }}
              hostPort: {{ .Values.gateway.listener.hostPort }}
              {{- end }}
            {{- range .Values.gateway.imports }}
            - name: {{ .name }}
              containerPort: {{ .port }}
              protocol: TCP
            {{- end }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: identity, mountPath: /identity, readOnly: true}
            - {name: service-routes, mountPath: /routes, readOnly: true}
          {{- if or .Values.gateway.listener.enabled (gt (len .Values.gateway.imports) 0) (gt (len .Values.gateway.sessions) 0) }}
            - {name: peer-bundles, mountPath: /peer-bundles, readOnly: true}
          {{- end }}
      volumes:
        - name: identity
          secret: {secretName: "{{ .Values.identitySecret }}", optional: true}
        - name: service-routes
          configMap: {name: among-clusters-service-routes, optional: true}
        {{- if or .Values.gateway.listener.enabled (gt (len .Values.gateway.imports) 0) (gt (len .Values.gateway.sessions) 0) }}
        - name: peer-bundles
          secret: {secretName: "{{ .Values.gateway.peerBundleSecret }}"}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata: {name: among-clusters-gateway}
spec:
  type: {{ .Values.gateway.service.type }}
  selector: {app.kubernetes.io/name: among-clusters-gateway}
  ports:
    - {name: gateway, port: {{ .Values.gateway.listener.port }}, targetPort: gateway, protocol: UDP}
    - {name: readiness, port: 8080, targetPort: readiness, protocol: TCP}
    {{- range .Values.gateway.imports }}
    - {name: {{ .name }}, port: {{ .port }}, targetPort: {{ .name }}, protocol: TCP}
    {{- end }}
