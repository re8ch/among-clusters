apiVersion: apps/v1
kind: Deployment
metadata: {name: among-clusters-agent}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: among-clusters-agent}}
  template:
    metadata: {labels: {app.kubernetes.io/name: among-clusters-agent}}
    spec:
      serviceAccountName: among-clusters-agent
      {{- with .Values.hostAliases }}
      hostAliases: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          command: [/agent]
          env:
            - {name: CLUSTER_ID, value: "{{ .Values.clusterID }}"}
            - {name: HUB_ENDPOINT, value: "{{ .Values.hubEndpoint }}"}
            - {name: IDENTITY_SECRET, value: "{{ .Values.identitySecret }}"}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {{- toYaml .Values.resources | nindent 12 }}
