apiVersion: v1
kind: ServiceAccount
metadata: {name: among-clusters-agent}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: among-clusters-agent-observer}
rules:
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: among-clusters-agent-observer}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: among-clusters-agent-observer}
subjects: [{kind: ServiceAccount, name: among-clusters-agent, namespace: "{{ .Release.Namespace }}"}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: among-clusters-agent-identity}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: ["{{ .Values.identitySecret }}"]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [among-clusters-service-routes]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  {{- if .Values.managedAccess.enabled }}
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: among-clusters-agent-identity}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: among-clusters-agent-identity}
subjects: [{kind: ServiceAccount, name: among-clusters-agent}]
{{- if .Values.managedAccess.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: "among-clusters-managed-access-{{ .Values.clusterID }}"}
rules:
  - {apiGroups: [""], resources: [serviceaccounts], verbs: [get, create]}
  - {apiGroups: [""], resources: [serviceaccounts/token], verbs: [create]}
  - {apiGroups: [rbac.authorization.k8s.io], resources: [roles, rolebindings, clusterroles, clusterrolebindings], verbs: [get, create, update, bind, escalate]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: "among-clusters-managed-access-{{ .Values.clusterID }}"}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "among-clusters-managed-access-{{ .Values.clusterID }}"}
subjects: [{kind: ServiceAccount, name: among-clusters-agent, namespace: "{{ .Release.Namespace }}"}]
{{- end }}
