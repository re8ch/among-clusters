apiVersion: v1
kind: ServiceAccount
metadata: {name: among-clusters-agent}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: "among-clusters-agent-{{ .Values.clusterID }}"}
rules:
  - apiGroups: [""]
    resources: [nodes, pods, namespaces, services]
    verbs: [get, list]
  - nonResourceURLs: [/version]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: "among-clusters-agent-{{ .Values.clusterID }}"}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "among-clusters-agent-{{ .Values.clusterID }}"}
subjects: [{kind: ServiceAccount, name: among-clusters-agent, namespace: "{{ .Release.Namespace }}"}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: among-clusters-agent-identity}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: ["{{ .Values.identitySecret }}"]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: among-clusters-agent-identity}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: among-clusters-agent-identity}
subjects: [{kind: ServiceAccount, name: among-clusters-agent}]
