clusterID: ""
tenant: ""
trustDomain: ""
hubEndpoint: https://among-clusters.re8ch.com
image:
  repository: ghcr.io/re8ch/among-clusters
  digest: ""
identitySecret: among-clusters-agent-identity
nodeSelector: {}
invitation:
  existingSecret: among-clusters-invitation
  idKey: invitation-id
  tokenKey: token
peerConfirmations: []
linkObservations: []
gateway:
  nodeSelector: {}
  # Optional provider metadata. The public chart deliberately defines no
  # provider address or topology; deployment owners supply those values.
  publicAuthority: {}
  # Existing Secret populated from mutually confirmed peer bundles. It must
  # contain ca.crt when the QUIC listener is enabled.
  peerBundleSecret: ""
  listener:
    enabled: false
    port: 8443
    publicEndpoint: ""
    hostPort: 0
  service:
    type: ClusterIP
  exports: []
  imports: []
  # BYOC clusters normally dial the provider-owned public authority and keep
  # this authenticated QUIC session alive. Either side may open service streams
  # over it; consumers never need a route to a customer's private Node IP.
  sessions: []
  peerIdentities: {}
advertisements: []
managedAccess:
  enabled: false
  serviceAccountName: among-clusters-managed-access
  brokerEndpoint: ""
  tlsServerName: kubernetes.default.svc
  approval: {create: false, grantRef: "", generation: 0}
hostAliases: []
networkPolicy:
  enabled: true
apiServer:
  # Kubernetes NetworkPolicy implementations may evaluate egress after Service
  # DNAT. Owners must list their control-plane endpoint CIDRs explicitly.
  cidrs: []
  port: 6443
ciliumPolicy:
  enabled: false
resources:
  requests: {cpu: 25m, memory: 32Mi}
  limits: {cpu: 250m, memory: 128Mi}
