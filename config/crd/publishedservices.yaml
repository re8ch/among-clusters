apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: publishedservices.collaboration.re8ch.com}
spec:
  group: collaboration.re8ch.com
  scope: Cluster
  names: {plural: publishedservices, singular: publishedservice, kind: PublishedService, shortNames: [acsvc]}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [publisher, consumers, kind, direction, accessContract]
              properties:
                publisher: {type: string}
                consumers: {type: array, minItems: 1, items: {type: string}}
                kind: {type: string}
                direction: {type: string, enum: [owner-to-consumer, consumer-to-owner, bidirectional]}
                endpoint: {type: string}
                accessContract: {type: string}
                declarations:
                  type: object
                  properties:
                    publisherEventRef: {type: string}
                    consumerEventRefs: {type: object, additionalProperties: {type: string}}
                revoked: {type: boolean, default: false}
            status:
              type: object
              properties:
                state: {type: string, enum: [Proposed, Active, Degraded, Revoked]}
                healthy: {type: boolean}
                lastObservedTime: {type: string, format: date-time}
                latencyMillis: {type: integer, format: int64}
