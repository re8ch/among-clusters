apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: collaborationevents.collaboration.re8ch.com}
spec:
  group: collaboration.re8ch.com
  scope: Cluster
  names: {plural: collaborationevents, singular: collaborationevent, kind: CollaborationEvent, shortNames: [acevent]}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [clusterID, sequence, occurredAt, type]
              x-kubernetes-validations:
                - {rule: self == oldSelf, message: CollaborationEvent is immutable}
              properties:
                clusterID: {type: string}
                sequence: {type: integer, format: int64, minimum: 1}
                occurredAt: {type: string, format: date-time}
                type: {type: string}
                subject: {type: string}
                details: {type: object, additionalProperties: {type: string}}
