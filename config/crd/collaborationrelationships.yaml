apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: collaborationrelationships.collaboration.re8ch.com}
spec:
  group: collaboration.re8ch.com
  scope: Cluster
  names: {plural: collaborationrelationships, singular: collaborationrelationship, kind: CollaborationRelationship, shortNames: [acrel]}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [participants, declarations]
              properties:
                participants: {type: array, minItems: 2, maxItems: 2, items: {type: string}}
                declarations:
                  type: object
                  required: [proposerEventRef, accepterEventRef]
                  properties:
                    proposerEventRef: {type: string}
                    accepterEventRef: {type: string}
                suspended: {type: boolean, default: false}
                dataPlaneSharing: {type: string, enum: [prohibited], default: prohibited}
            status:
              type: object
              properties:
                state: {type: string, enum: [Proposed, Active, Suspended, Revoked]}
                reason: {type: string}
                observedGeneration: {type: integer, format: int64}
